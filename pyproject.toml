[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "syster-cli"
# Version is derived from Cargo.toml by maturin (see [tool.maturin].manifest-path)
# to keep the wheel and crate versions in lockstep — do not hardcode it here.
dynamic = ["version"]
description = "SysML v2 and KerML analysis CLI (binary distribution)"
readme = "README.md"
license = "MIT"
authors = [{ name = "jade-codes" }]
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Compilers",
]

[project.urls]
Repository = "https://github.com/jade-codes/syster-cli"
Issues = "https://github.com/jade-codes/syster-cli/issues"

[tool.maturin]
bindings = "bin"
manifest-path = "Cargo.toml"
strip = true
